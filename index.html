    <!-- Prevent circular structure serialization errors from breaking third-party scripts (like UTMIFY) on React elements -->
    <script>
      (function() {
        if (typeof window === "undefined" || typeof JSON === "undefined") return;
        var originalStringify = JSON.stringify;
        if (!originalStringify) return;
        JSON.stringify = function(value, replacer, space) {
          try {
            return originalStringify(value, replacer, space);
          } catch (err) {
            try {
              var seen = new WeakSet();
              return originalStringify(value, function(key, val) {
                var currentVal = val;
                if (typeof replacer === "function") {
                  try { currentVal = replacer.call(this, key, val); } catch (e) {}
                }
                if (currentVal !== null && typeof currentVal === "object") {
                  if (typeof Node !== "undefined" && currentVal instanceof Node) {
                    return { nodeType: currentVal.nodeType, nodeName: currentVal.nodeName, id: currentVal.id || undefined, className: currentVal.className || undefined };
                  }
                  if (typeof Window !== "undefined" && currentVal instanceof Window) return "[Window]";
                  if (typeof Event !== "undefined" && currentVal instanceof Event) return { type: currentVal.type, isTrusted: currentVal.isTrusted };
                  if (seen.has(currentVal)) return undefined;
                  seen.add(currentVal);
                }
                return currentVal;
              }, space);
            } catch (fallbackErr) {
              return "{}";
            }
          }
        };
      })();
    </script>

    <!-- Defer third-party tracking scripts until first user interaction or fallback timeout to optimize performance -->
    <script>
      (function() {
        var scriptsLoaded = false;
        function loadTrackingScripts() {
          if (scriptsLoaded) return;
          scriptsLoaded = true;

          try {
            window.removeEventListener('scroll', loadTrackingScripts, { passive: true });
            window.removeEventListener('pointermove', loadTrackingScripts, { passive: true });
            window.removeEventListener('touchstart', loadTrackingScripts, { passive: true });
            window.removeEventListener('click', loadTrackingScripts, { passive: true });
          } catch (e) {}

          // 1. UTMIFY Main Script
          try {
            var utmifyScript = document.createElement('script');
            utmifyScript.src = "https://cdn.utmify.com.br/scripts/utms/latest.js";
            utmifyScript.setAttribute('data-utmify-prevent-xcod-sck', '');
            utmifyScript.setAttribute('data-utmify-prevent-subids', '');
            utmifyScript.async = true;
            utmifyScript.defer = true;
            document.head.appendChild(utmifyScript);
          } catch (e) {
            console.warn("Utmify load warning:", e);
          }
        }

        // Add passive events for instant load on actual human interactions
        window.addEventListener('scroll', loadTrackingScripts, { passive: true });
        window.addEventListener('pointermove', loadTrackingScripts, { passive: true });
        window.addEventListener('touchstart', loadTrackingScripts, { passive: true });
        window.addEventListener('click', loadTrackingScripts, { passive: true });

        // Fallback: trigger after 3.5 seconds
        if (window.requestIdleCallback) {
          window.requestIdleCallback(function() {
            setTimeout(loadTrackingScripts, 3500);
          });
        } else {
          setTimeout(loadTrackingScripts, 4000);
        }
      })();
    </script>
